name: DPM Windows beta
on:
  push:
    branches: [dpm-windows-beta]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install Windows build dependencies
        run: python -m pip install --only-binary=:all: --find-links wheels -r requirements-windows.txt
      - name: Check dependencies
        run: python -m pip check
      - name: Test Windows adapters and ranking
        run: python -m unittest -v test_windows test_arcs test_transitions
      - name: Build executable and check frozen imports
        run: python build_windows.py
      - uses: actions/upload-artifact@v4
        with:
          name: 5D-DPM-Windows-v0.12-beta
          path: 5D-DPM-Windows-v0.12-beta.zip
          if-no-files-found: error
          retention-days: 14
